<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Form</title>
    <link rel="stylesheet" href="/css/styleform.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        header {
            background-color: red;
            padding: 30px;
            text-align: center;
            font-size: 35px;
            color: white;
        }
        article {
            /* background-color: yellow; */
            float: left;
            padding: 20px;
            width: 70%;
            height: auto;
        }
        
        nav {
            background-color: orange;
            float: left;
            width: 30%;
            height: auto;
            padding: 20px;
        }
        nav ul {
             list-style-type: disc;
             padding: 0;
            }
            section::after {
            content: "";
            display: table;
             clear: both;
            }
        a {
            text-decoration: none;
            color: red;
        }
        footer {
            background-color: greenyellow;
            padding: 10px;
            text-align: center;
            color: white;
        }
        @media (max-width: 600px) {
            nav, article {
                width: 100%;
                height: auto;
            }
        }
        img {
            float: left;
        }

    </style>
</head>
<body>
    <header>
         HEADER 
    </header>
    <section>
        <nav>
            <ul>
                <li><a href="layout.html"> Layout </a></li>
                <li><a href="inputform.html"> Input Form </a></li>
                <li><a href="https://www.kmutnb.ac.th"> KMUTNB </a></li>
                <li><a href="https://www.fitm.kmutnb.ac.th/"> FITM </a></li>
                <li><a href="https://www.facebook.com/matee.tls"> FACEBOOK </a></li>
            </ul>
        </nav>
        <article>
        <h1>Input Form</h1>
        <form action="#">
            <label for="">Username: </label>
            <input type="text" name="" id="" required><br><br>
            <label for="">Password: </label>
            <input type="password" name="" id="" required><br><br>
            <label for="">Email:    </label>
            <input type="email" name="" id="" required><br><br>
                        <label for="phone">เบอร์โทรติดต่อ:</label>
  <input type="tel" name="phone" pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}"><br>

              <label for="birthday">Birthday:</label>
            <input type="date" id="birthday" name="birthday">
            <br>
            <label for="appt">เวลาเกิด:</label>
  <input type="time" id="appt" name="appt">
  <br>
  <label for="homepage">Facebook:</label>
  <input type="url" id="homepage" name="homepage">
  <br>

              <label for="myfile">ใส่รูปภาพนักศึกษา:</label>
                <input type="file" id="myfile" name="myfile">
                <br>
                <label >น้ำหนัก (กก.):</label>
                <input type="number" min="20" max="200">
                <br>
                <label >ส่วนสูง (ซม.):</label>
                <input type="number" min="100" max="200">
                <br>
            
            <br><br>
            <!-- Radio   -->
            <input type="radio" name="Graduated" value="ม.6">
                <label >ม.6</label><br>
            <input type="radio" name="Graduated" value="ปวช.">
                <label >ปวช.</label><br>
            <input type="radio" name="Graduated" value="ปวส.">
                <label >ปวส.</label><Br>
            <input type="radio" name="Graduated" value="อนุปริญญา">
                <label >อนุปริญญา</label>
                <Br><br>

                 <!--Checkbox-->
            <input type="checkbox" name="Major1" value="IT">
                    <label > IT</label><br>
             <input type="checkbox" name="Major2" value="ITI">
                    <label > ITI</label><br>
            <input type="checkbox" name="Major3" value="ITT">
                    <label > ITT</label><br>
            <input type="checkbox" name="Major4" value="INE">
                    <label > INE</label><br>
            <input type="checkbox" name="Major5" value="INET">
                    <label > INET</label><br><br>

                    <label for="vol">จะเรียนจบปีไหน (2569-2590):</label>
            <input type="range" min="0" max="50">
                    <br>
                    <label for="gsearch">Search Google:</label>
            <input type="search" id="gsearch" name="gsearch">
            <br>
            <button type="button" class="btn btn-success">Success</button>
            <button type="button" class="btn btn-warning">Warning</button>
            <button type="button" class="btn btn-danger">Danger</button>


                    <br><br>
            <input type="button" class="btn btn-success" value="Submit"> 
            <input type="reset" class="btn btn-danger" value="Reset">
        </form>


        </article>
        
        <br>
        <!-- table>tr*10>td*5  -->

    </section>
   <footer>
    <a href="index.html">Go index</a>
   </footer>
</body>
</html>
